name: Build Clean Your TV launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build files
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build official launcher
        run: cd launcher && ./gradlew --no-daemon assembleRelease

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
